<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Magellan</title>
    <script>
      // GitHub Pages SPA redirect
      // Encodes the current path into a query string and redirects to index.html,
      // which will decode it and use history.replaceState to restore the URL.
      var pathSegmentsToKeep = 1; // keep '/magellan' prefix
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
